name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test
      - run: npm run mutation-check
      # The mutation check breaks guards on purpose; this proves it put every one back.
      - run: git diff --exit-code src bin
      # The word list lives in a repository secret and nowhere in the repo. Without it (a fork's
      # pull request) the step says it was skipped.
      - run: npm run check:private-words
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
      - run: npm run install-proof
